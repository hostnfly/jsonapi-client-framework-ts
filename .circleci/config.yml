# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Jobs run on every branch push by default but are skipped on tag pushes
# unless they opt in with this filter — required for anything `deploy` depends on.
release_tag: &release_tag
  only: /^v\d+\.\d+\.\d+$/

commands:
  install-dependencies:
    steps:
      - checkout
      - run:
          name: Enabling corepack
          command: |
            mkdir -p "$HOME/.corepack"
            corepack enable --install-directory "$HOME/.corepack"
            echo 'export PATH="$HOME/.corepack:$PATH"' >> "$BASH_ENV"
      - run:
          name: Installing dependencies
          command: pnpm install --frozen-lockfile

jobs:
  build:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Building package
          command: pnpm build

  tests:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Running tests
          command: pnpm test

  lint:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Running linter
          command: pnpm lint

  type_check:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Running type checking
          command: pnpm typecheck

  format:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Checking formatting
          command: pnpm format:check

  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - install-dependencies
      - run:
          name: Building package
          command: pnpm build
      - run:
          name: Publishing to npm
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            pnpm publish --no-git-checks

workflows:
  version: 2
  ci:
    jobs:
      - build:
          filters:
            tags: *release_tag
      - tests:
          filters:
            tags: *release_tag
      - lint:
          filters:
            tags: *release_tag
      - type_check:
          filters:
            tags: *release_tag
      - format:
          filters:
            tags: *release_tag
      - deploy:
          requires:
            - build
            - tests
            - lint
            - type_check
            - format
          filters:
            tags: *release_tag
            branches:
              ignore: /.*/
